spring:
  datasource:
    driver-class-name: org.h2.Driver
    # 内嵌 H2 文件库（data/shop.mv.db），免安装 MySQL；删除 data 目录即可重置
    url: ${SHOP_DB_URL:jdbc:h2:file:./data/shop;MODE=MySQL}
    username: ${SHOP_DB_USERNAME:sa}
    password: ${SHOP_DB_PASSWORD:}

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOP_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${SHOP_JPA_DDL_AUTO:update}
    # 先由 Hibernate 建表，再执行 data.sql 灌入演示数据
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      # data.sql 为 UTF-8，必须显式指定，否则中文环境（GBK）下会乱码
      encoding: utf-8

nginx:
  # 静态资源基地址：默认指向应用自身（图片已置于 static/goods、static/banners）
  path: ${SHOP_ASSET_BASE_URL:http://localhost:9800/}

shop:
  log:
    path: ${SHOP_LOG_PATH:logs}


logging:
  config: classpath:logback-spring.xml

server:
  port: ${SERVER_PORT:9800}
