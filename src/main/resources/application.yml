spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHOP_DB_URL:jdbc:mysql://localhost:3306/shop_recommendation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHOP_DB_USERNAME:root}
    password: ${SHOP_DB_PASSWORD:}

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOP_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${SHOP_JPA_DDL_AUTO:update}
nginx:
  path: ${SHOP_ASSET_BASE_URL:http://localhost:8888/shop/}

shop:
  log:
    path: ${SHOP_LOG_PATH:logs}


logging:
  config: classpath:logback-spring.xml

server:
  port: ${SERVER_PORT:9800}
